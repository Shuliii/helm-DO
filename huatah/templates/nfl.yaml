{{/* Disabled while NFL scraper is being refactored to serverless; flip to `true` to re-enable. */}}
{{- if true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huatah-nfl-deployment
  labels:
    app: huatah-nfl
spec:
  replicas: {{ .Values.scrapers.replicas }}
  selector:
    matchLabels:
      app: huatah-nfl
  template:
    metadata:
      labels:
        app: huatah-nfl
    spec:
      containers:
        - name: huatah
          image: {{ .Values.scrapers.image.repository }}:{{ .Values.scrapers.nfl.imageTag | default .Values.scrapers.image.tag }}
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          env:
            - name: LEAGUE_NAMES
              value: {{ .Values.scrapers.nfl.leagueNames | quote }}
            - name: MY_URL
              value: {{ .Values.scrapers.myUrl | quote }}
            - name: LEAGUE_CODE
              value: {{ .Values.scrapers.nfl.leagueCode | quote }}
            - name: TYPE
              value: {{ .Values.scrapers.nfl.type | quote }}
            - name: interval
              value: {{ .Values.scrapers.interval | quote }}
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huatah-secret
                  key: REDIS_PASSWORD
            - name: REDIS_KEY
              value: "scraper:nfl"
            - name: REDIS_TTL
              value: "480"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-nfl-ci
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 3000
      protocol: TCP
  selector:
    app: huatah-nfl
{{- end }}


