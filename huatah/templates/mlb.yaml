apiVersion: batch/v1
kind: CronJob
metadata:
  name: huatah-mlb-cronjob
spec:
  schedule: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: huatah-mlb
              image: {{ .Values.scrapers.image.repository }}:{{ .Values.scrapers.image.tag }}
              imagePullPolicy: Always
              env:
                - name: RUN_MODE
                  value: "once"
                - name: LEAGUE_NAMES
                  value: {{ .Values.scrapers.mlb.leagueNames | quote }}
                - name: MY_URL
                  value: {{ .Values.scrapers.myUrl | quote }}
                - name: LEAGUE_CODE
                  value: {{ .Values.scrapers.mlb.leagueCode | quote }}
                - name: TYPE
                  value: {{ .Values.scrapers.mlb.type | quote }}
                - name: REDIS_HOST
                  value: "redis"
                - name: REDIS_PORT
                  value: "6379"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: huatah-secret
                      key: REDIS_PASSWORD
                - name: REDIS_KEY
                  value: "scraper:mlb"
                - name: REDIS_TTL
                  value: "900"