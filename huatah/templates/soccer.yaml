apiVersion: batch/v1
kind: CronJob
metadata:
  name: huatah-soccer-cronjob
spec:
  schedule: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: huatah-soccer
              image: {{ .Values.scrapers.image.repository }}:{{ .Values.scrapers.image.tag }}
              imagePullPolicy: Always
              env:
                - name: RUN_MODE
                  value: "once"
                - name: LEAGUE_NAMES
                  value: {{ .Values.scrapers.soccer.leagueNames | quote }}
                - name: MY_URL
                  value: {{ .Values.scrapers.myUrl | quote }}
                - name: LEAGUE_CODE
                  value: {{ .Values.scrapers.soccer.leagueCode | quote }}
                - name: TYPE
                  value: {{ .Values.scrapers.soccer.type | quote }}
                - name: REDIS_HOST
                  value: "redis"
                - name: REDIS_PORT
                  value: "6379"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: huatah-secret
                      key: REDIS_PASSWORD
                - name: REDIS_KEY
                  value: "scraper:soccer"
                - name: REDIS_TTL
                  value: "900"