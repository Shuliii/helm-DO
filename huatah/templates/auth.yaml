apiVersion: apps/v1
kind: Deployment
metadata:
  name: huatah-auth-deployment
  labels:
    app: huatah-auth
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: huatah-auth
  template:
    metadata:
      labels:
        app: huatah-auth
    spec:
      containers:
        - name: huatah
          image: {{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}
          ports:
            - containerPort: 8081
          imagePullPolicy: Always
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: huatah-secret
                  key: JWT_SECRET
            - name: DB_HOST
              value: {{ .Values.auth.dbHost | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: huatah-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huatah-secret
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: huatah-secret
                  key: MYSQL_DATABASE
---
apiVersion: v1
kind: Service
metadata:
  name: backend-auth-ci
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: huatah-auth
