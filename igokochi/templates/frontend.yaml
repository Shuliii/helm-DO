apiVersion: apps/v1
kind: Deployment
metadata:
  name: igokochi-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: igokochi-frontend
  template:
    metadata:
      labels:
        app: igokochi-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: {{ .Values.frontend.apiBaseUrl | quote }}
            - name: SLOT_CAPACITY
              value: {{ .Values.frontend.slotCapacity | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: igokochi-frontend
  labels:
    app: igokochi-frontend
spec:
  type: ClusterIP
  selector:
    app: igokochi-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
