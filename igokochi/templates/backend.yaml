apiVersion: apps/v1
kind: Deployment
metadata:
  name: igokochi-backend
  labels:
    app: igokochi-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: igokochi-backend
  template:
    metadata:
      labels:
        app: igokochi-backend
    spec:
      containers:
        - name: igokochi-backend
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: AUTH_BASE_URL
              value: {{ .Values.backend.authBaseUrl | quote }}
            - name: DB_HOST
              value: {{ .Values.backend.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.backend.dbPort | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: igokochi-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: igokochi-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igokochi-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: igokochi-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: igokochi-backend
  labels:
    app: igokochi-backend
spec:
  type: ClusterIP
  selector:
    app: igokochi-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
